services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command:
      - --host=0.0.0.0
      - --port=8545
      - --chain-id=31337
    ports:
      - "8545:8545"
    profiles: ["anvil"]

  geth:
    image: ethereum/client-go:stable
    command:
      - --dev
      - --dev.period=1
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8546
      - --http.api=eth,net,web3,debug
      - "--http.corsdomain=*"
      - "--http.vhosts=*"
      - --http.rpcprefix=/
    ports:
      - "8546:8546"
    profiles: ["geth"]
